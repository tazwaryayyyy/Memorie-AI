[package]
# Package (crates.io) name. The library target keeps `name = "memoire"` below so
# `use memoire::...`, libmemoire.so and the C ABI are unchanged.
name = "memoire-engine"
version = "0.1.0"
edition = "2021"
description = "A local-first, embeddable long-term memory engine for AI coding agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tazwaryayyyy/Memorie-AI"
homepage = "https://github.com/tazwaryayyyy/Memorie-AI"
keywords = ["ai", "memory", "embeddings", "sqlite", "ffi"]
categories = ["database", "science::ml"]
include = [
    "/src/**",
    "/migrations/**",
    "/examples/basic_usage.rs",
    "/benches/**",
    "/include/memoire.h",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/Cargo.toml",
    "/Cargo.lock",
    "/build.rs",
]

[lib]
name = "memoire"
crate-type = ["cdylib", "rlib"]

[dependencies]
# ─── Shared (all targets, including wasm32) ──────────────────────────────────
blake3 = "1"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# ─── Native-only (optional, activated by the `native` feature) ───────────────
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
r2d2 = { version = "0.8", optional = true }
r2d2_sqlite = { version = "0.24", optional = true }
fastembed = { version = "=5.13.2", default-features = false, features = ["online", "ort-download-binaries-native-tls"], optional = true }
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["full"], optional = true }

# ─── Optional feature-gated ───────────────────────────────────────────────────
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py310"], optional = true }
# WASM random number generation (activated by `wasm` feature)
getrandom = { version = "0.2", features = ["js"], optional = true }

# ─── Not on wasm32: ONNX, C parsers, SQLite-side helpers ─────────────────────
# Mirrors the `cfg(not(target_arch = "wasm32"))` gates in src/. (clap, colored,
# walkdir, rayon, once_cell and dirs were declared but never used; removed.)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
instant-distance = "0.6"
tree-sitter = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = { version = "0.23", features = [] }
# ONNX Runtime must be linked, not located at runtime: do NOT enable `load-dynamic`.
# It makes ort-sys skip linking entirely and `LoadLibrary("onnxruntime.dll")` /
# dlopen("libonnxruntime.so") by bare name, which fails when no runtime is on the
# loader path and, on Windows, can pick up an unrelated System32 onnxruntime.dll.
# Default features keep the prebuilt static binaries (`download-binaries`) that
# fastembed's `ort-download-binaries-native-tls` also selects, so linking works
# even when `native` (and thus fastembed) is off.
# Keep `load-dynamic` off (breaks Windows/wheels) and `copy-dylibs` off (panics under Cargo 1.100 build-dir layout).
ort = { version = "2.0.0-rc.11", default-features = false, features = ["std", "download-binaries", "tls-native"] }
tokenizers = { version = "0.19.1", default-features = false, features = ["onig"] }

[features]
default = ["native"]
# Native feature bundle: SQLite + embedding model + HTTP server.
# Activated by default on native targets.
native = ["dep:rusqlite", "dep:r2d2", "dep:r2d2_sqlite", "dep:fastembed", "dep:axum", "dep:tokio"]
pyo3 = ["dep:pyo3"]
# WASM-compatible build — excludes SQLite, ONNX, async runtime.
# Usage: cargo build --target wasm32-unknown-unknown --no-default-features --features wasm
wasm = ["dep:getrandom"]

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"
required-features = ["native"]

[[bin]]
name = "memoire-cli"
path = "src/bin/cli.rs"
required-features = ["native"]

[[bin]]
name = "memoire-server"
path = "src/bin/memoire_server.rs"
required-features = ["native"]

[[bench]]
name = "core_bench"
harness = false
required-features = ["native"]

[build-dependencies]
# Uncomment to auto-generate include/memoire.h from FFI source:
# cbindgen = "0.26"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
