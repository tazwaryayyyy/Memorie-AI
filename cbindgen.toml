# cbindgen configuration for src/ffi.rs.
#
# include/memoire.h is HAND-MAINTAINED (it carries extra docs and the
# <stdint.h> types). This file exists to (a) keep the exported symbol list in
# one place, which tests/ffi_header_parity.rs checks against src/ffi.rs, and
# (b) let you generate a header to compare against the committed one. It is not
# wired into build.rs.
#
# Check for drift (cbindgen 0.29 verified; --crate takes the PACKAGE name, which
# is `memoire-engine`, not the library name `memoire`):
#
#   cargo install cbindgen --locked
#   cbindgen --config cbindgen.toml --crate memoire-engine --output /tmp/memoire.h
#   diff include/memoire.h /tmp/memoire.h     # expect comment/whitespace/int64_t-vs-long-long noise only
#
# Do not set [export] prefix: it renames types (MemoireHandle would become
# memoire_MemoireHandle), which breaks the committed header's public type name.

language   = "C"
header     = "/* Generated by cbindgen for comparison only; include/memoire.h is hand-maintained. */"
include_guard = "MEMOIRE_H"
cpp_compat = true
tab_width  = 2
documentation = true
documentation_style = "c99"

[export]
include = [
  "memoire_new",
  "memoire_new_ns",
  "memoire_free",
  "memoire_remember",
  "memoire_recall",
  "memoire_reinforce_if_used",
  "memoire_penalize_if_used",
  "memoire_forget",
  "memoire_resolve_contradictions",
  "memoire_count",
  "memoire_clear",
  "memoire_free_string",
]

[parse]
parse_deps = false
