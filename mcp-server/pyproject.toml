[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memoire-mcp"
version = "0.1.0"
description = "MCP Server for the Memoire semantic memory engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]==1.27.1",
    # PROVISIONAL distribution name for the Python SDK (import name stays
    # `memoire`). The unrelated PyPI project "memoire" must not be used here.
    # Final name is an owner decision; do not publish before it is made.
    "memoire-engine>=0.1.0,<0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[project.scripts]
memoire-mcp = "server:main"

[project.urls]
Homepage = "https://github.com/tazwaryayyyy/Memorie-AI"
Repository = "https://github.com/tazwaryayyyy/Memorie-AI"
Issues = "https://github.com/tazwaryayyyy/Memorie-AI/issues"
Changelog = "https://github.com/tazwaryayyyy/Memorie-AI/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["server"]

[tool.uv.sources]
memoire-engine = { path = "../bindings/python", editable = true }

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["."]
