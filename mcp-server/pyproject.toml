[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memoire-mcp"
version = "0.1.0"
description = "MCP Server for the Memoire semantic memory engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]==1.27.1",
    # Python SDK (import package `memoire_engine`). The unrelated PyPI project
    # "memoire" must never be used here. Distribution name `memoire-engine` is
    # unregistered until the owner publishes it.
    "memoire-engine>=0.1.0,<0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[project.scripts]
memoire-mcp = "memoire_mcp.server:main"

[project.urls]
Homepage = "https://github.com/tazwaryayyyy/Memorie-AI"
Repository = "https://github.com/tazwaryayyyy/Memorie-AI"
Issues = "https://github.com/tazwaryayyyy/Memorie-AI/issues"
Changelog = "https://github.com/tazwaryayyyy/Memorie-AI/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["memoire_mcp"]

[tool.uv.sources]
memoire-engine = { path = "../bindings/python", editable = true }

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["."]
