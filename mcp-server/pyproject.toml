[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memoire-mcp"
version = "0.1.0"
description = "MCP Server for the Memoire semantic memory engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # Stay on the 1.x SDK line this server was written against (`mcp.server.fastmcp`).
    "mcp[cli]>=1.30.0,<2",
    # Python SDK (import package `memoire_engine`), published on PyPI as `memoire-engine`.
    # The unrelated PyPI project "memoire" must never be used here.
    "memoire-engine>=0.1.0,<0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
]

[project.scripts]
memoire-mcp = "memoire_mcp.server:main"

[project.urls]
Homepage = "https://github.com/tazwaryayyyy/memoire-ai"
Repository = "https://github.com/tazwaryayyyy/memoire-ai"
Issues = "https://github.com/tazwaryayyyy/memoire-ai/issues"
Changelog = "https://github.com/tazwaryayyyy/memoire-ai/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["memoire_mcp"]

[tool.uv.sources]
memoire-engine = { path = "../bindings/python", editable = true }

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["."]
