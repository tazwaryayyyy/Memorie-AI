[target.aarch64-unknown-linux-gnu]
# ARM NEON is always available on AArch64 — LLVM enables it automatically.
rustflags = []

[target.aarch64-apple-darwin]
# Apple Silicon — NEON enabled by default
rustflags = []

# NOTE: no `-C target-feature=+avx2,+fma` on x86_64. Binaries built here are
# distributed (GitHub Releases, wheels) and must run on any x86_64 CPU/VM; a
# hard-coded AVX2 baseline raises SIGILL on CPUs or hypervisors without it.

# Alias for common workflows
[alias]
unit     = "test --lib"
integ    = "test --test integration_test"
check-all = "clippy --all-targets --all-features -- -D warnings"
